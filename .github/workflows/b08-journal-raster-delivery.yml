name: B08 Asset Raster Delivery
# B08 deterministic delivery verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'proof/B08_JP_MASTERS/**'
      - 'proof/B08_DP_MASTERS/**'
      - 'proof/B08_EP_MASTERS/**'
      - 'proof/B08_PNG_MASTERS/**'
      - 'proof/B08_TB_MASTERS/**'
      - '.github/workflows/b08-journal-raster-delivery.yml'

permissions:
  contents: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install raster tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 -m pip install --upgrade pillow

      - name: Validate journal masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          masters = sorted(Path("proof/B08_JP_MASTERS").glob("SL_JP_*.svg"))
          if len(masters) != 20:
              raise SystemExit(f"Expected 20 journal masters, found {len(masters)}")
          for p in masters:
              ET.parse(p)
          print("B08 source master preflight PASS: 20/20 valid SVG files")
          PY

      - name: Validate digital paper masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          masters = sorted(Path("proof/B08_DP_MASTERS").glob("SL_DP_*.svg"))
          if len(masters) != 15:
              raise SystemExit(f"Expected 15 digital paper masters, found {len(masters)}")
          for p in masters:
              ET.parse(p)
          print("B08 digital paper master preflight PASS: 15/15 valid SVG files")
          PY

      - name: Validate ephemera masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          masters = sorted(Path("proof/B08_EP_MASTERS").glob("SL_EP_*.svg"))
          if len(masters) != 20:
              raise SystemExit(f"Expected 20 ephemera masters, found {len(masters)}")
          for p in masters:
              ET.parse(p)
          print("B08 ephemera master preflight PASS: 20/20 valid SVG files")
          PY

      - name: Validate decorative PNG masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          masters = sorted(Path("proof/B08_PNG_MASTERS").glob("SL_PNG_*.svg"))
          if len(masters) != 20:
              raise SystemExit(f"Expected 20 decorative PNG masters, found {len(masters)}")
          for p in masters:
              ET.parse(p)
          print("B08 decorative PNG master preflight PASS: 20/20 valid SVG files")
          PY

      - name: Render US Letter and A4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES/US_LETTER
          mkdir -p delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES/A4
          mkdir -p /tmp/b08_png

          count=0
          for svg in proof/B08_JP_MASTERS/SL_JP_*.svg; do
            base="$(basename "$svg" .svg)"
            count=$((count + 1))
            echo "Rendering $base"
            rsvg-convert --width=2550 --height=3300 --background-color='#E9E0CA' --output="/tmp/b08_png/${base}_US_LETTER.png" "$svg"
            rsvg-convert --width=2480 --height=3508 --background-color='#E9E0CA' --output="/tmp/b08_png/${base}_A4.png" "$svg"
          done
          test "$count" -eq 20

      - name: Render digital papers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/SECRET_LIBRARY_KIT/02_DIGITAL_PAPERS
          mkdir -p /tmp/b08_dp_png
          count=0
          for svg in proof/B08_DP_MASTERS/SL_DP_*.svg; do
            base="$(basename "$svg" .svg)"
            count=$((count + 1))
            echo "Rendering $base"
            rsvg-convert --width=3600 --height=3600 --background-color='#E9E0CA' --output="/tmp/b08_dp_png/${base}.png" "$svg"
          done
          test "$count" -eq 15

      - name: Render ephemera PNGs with transparency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/SECRET_LIBRARY_KIT/03_EPHEMERA
          count=0
          for svg in proof/B08_EP_MASTERS/SL_EP_*.svg; do
            base="$(basename "$svg" .svg)"
            count=$((count + 1))
            echo "Rendering $base"
            rsvg-convert --width=3600 --height=2400 --output="delivery/SECRET_LIBRARY_KIT/03_EPHEMERA/${base}.png" "$svg"
          done
          test "$count" -eq 20

      - name: Validate tags and bookmark masters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          masters = sorted(Path("proof/B08_TB_MASTERS").glob("SL_TB_*.svg"))
          if len(masters) != 10:
              raise SystemExit(f"Expected 10 tag/bookmark masters, found {len(masters)}")
          for p in masters:
              ET.parse(p)
          print("B08 tags/bookmarks master preflight PASS: 10/10 valid SVG files")
          PY

      - name: Render decorative PNGs with transparency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/SECRET_LIBRARY_KIT/04_DECORATIVE_PNG
          count=0
          for svg in proof/B08_PNG_MASTERS/SL_PNG_*.svg; do
            base="$(basename "$svg" .svg)"
            count=$((count + 1))
            echo "Rendering $base"
            rsvg-convert --width=3600 --height=3600 --output="delivery/SECRET_LIBRARY_KIT/04_DECORATIVE_PNG/${base}.png" "$svg"
          done
          test "$count" -eq 20

      - name: Render tags and bookmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b08_tb_png
          count=0
          for svg in proof/B08_TB_MASTERS/SL_TB_*.svg; do
            base="$(basename "$svg" .svg)"
            count=$((count + 1))
            if [[ "$base" =~ SL_TB_00[1-5]_ ]]; then
              rsvg-convert --width=2400 --height=3600 --output="/tmp/b08_tb_png/${base}.png" "$svg"
            else
              rsvg-convert --width=2400 --height=6000 --output="/tmp/b08_tb_png/${base}.png" "$svg"
            fi
          done
          test "$count" -eq 10

      - name: Convert tags and bookmarks to JPG and set 300 DPI metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path("/tmp/b08_tb_png")
          out=Path("delivery/SECRET_LIBRARY_KIT/05_TAGS_BOOKMARKS")
          out.mkdir(parents=True,exist_ok=True)
          for p in sorted(src.glob("*.png")):
              im=Image.open(p).convert("RGB")
              n=int(p.stem.split("_")[2])
              expected=(2400,3600) if n <= 5 else (2400,6000)
              if im.size != expected: raise SystemExit(f"Unexpected size: {p} -> {im.size}, expected {expected}")
              im.save(out/p.with_suffix(".jpg").name,"JPEG",quality=92,optimize=True,progressive=True,dpi=(300,300),subsampling=0)
          PY

      - name: Convert journal pages to JPG and set 300 DPI metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("/tmp/b08_png")
          letter = Path("delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES/US_LETTER")
          a4 = Path("delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES/A4")
          for p in sorted(src.glob("*.png")):
              im = Image.open(p).convert("RGB")
              if p.name.endswith("_US_LETTER.png"):
                  expected = (2550, 3300)
                  out = letter / p.with_suffix(".jpg").name
              else:
                  expected = (2480, 3508)
                  out = a4 / p.with_suffix(".jpg").name
              if im.size != expected:
                  raise SystemExit(f"Unexpected size: {p} -> {im.size}, expected {expected}")
              im.save(out, "JPEG", quality=88, optimize=True, progressive=True, dpi=(300, 300), subsampling=0)
          PY

      - name: Convert digital papers to JPG and set 300 DPI metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("/tmp/b08_dp_png")
          outdir = Path("delivery/SECRET_LIBRARY_KIT/02_DIGITAL_PAPERS")
          for p in sorted(src.glob("*.png")):
              im = Image.open(p).convert("RGB")
              if im.size != (3600, 3600):
                  raise SystemExit(f"Unexpected digital paper size: {p} -> {im.size}")
              im.save(outdir / p.with_suffix(".jpg").name, "JPEG", quality=90, optimize=True, progressive=True, dpi=(300, 300), subsampling=0)
          PY

      - name: Repository-level QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          roots = [
              (Path("delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES/US_LETTER"), (2550, 3300)),
              (Path("delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES/A4"), (2480, 3508)),
          ]
          total = 0
          for root, expected in roots:
              files = sorted(root.glob("*.jpg"))
              if len(files) != 20:
                  raise SystemExit(f"{root}: expected 20 JPG files, found {len(files)}")
              for p in files:
                  im = Image.open(p)
                  if im.size != expected: raise SystemExit(f"{p}: wrong size {im.size}")
                  if im.mode != "RGB": raise SystemExit(f"{p}: wrong mode {im.mode}")
                  dpi = im.info.get("dpi")
                  if not dpi or abs(dpi[0]-300) > 1 or abs(dpi[1]-300) > 1: raise SystemExit(f"{p}: wrong DPI {dpi}")
                  if len(p.name) > 70: raise SystemExit(f"{p}: filename exceeds 70 characters")
                  total += 1
          if total != 40: raise SystemExit(f"Expected 40 total JPGs, found {total}")
          dp = sorted(Path("delivery/SECRET_LIBRARY_KIT/02_DIGITAL_PAPERS").glob("*.jpg"))
          if len(dp) != 15:
              raise SystemExit(f"Digital papers: expected 15 JPG files, found {len(dp)}")
          for p in dp:
              im = Image.open(p)
              if im.size != (3600, 3600): raise SystemExit(f"{p}: wrong size {im.size}")
              if im.mode != "RGB": raise SystemExit(f"{p}: wrong mode {im.mode}")
              dpi = im.info.get("dpi")
              if not dpi or abs(dpi[0]-300) > 1 or abs(dpi[1]-300) > 1: raise SystemExit(f"{p}: wrong DPI {dpi}")
              if len(p.name) > 70: raise SystemExit(f"{p}: filename exceeds 70 characters")
          ep = sorted(Path("delivery/SECRET_LIBRARY_KIT/03_EPHEMERA").glob("*.png"))
          if len(ep) != 20:
              raise SystemExit(f"Ephemera: expected 20 PNG files, found {len(ep)}")
          for p in ep:
              im = Image.open(p)
              if im.size != (3600, 2400): raise SystemExit(f"{p}: wrong size {im.size}")
              if im.mode not in ("RGBA", "LA"): raise SystemExit(f"{p}: transparency channel missing, mode={im.mode}")
              lo, hi = im.getchannel("A").getextrema()
              if lo != 0 or hi == 0: raise SystemExit(f"{p}: expected transparent canvas with non-empty artwork")
              if len(p.name) > 70: raise SystemExit(f"{p}: filename exceeds 70 characters")
          png = sorted(Path("delivery/SECRET_LIBRARY_KIT/04_DECORATIVE_PNG").glob("*.png"))
          if len(png) != 20:
              raise SystemExit(f"Decorative PNG: expected 20 files, found {len(png)}")
          for p in png:
              im = Image.open(p)
              if im.size != (3600, 3600): raise SystemExit(f"{p}: wrong size {im.size}")
              if im.mode not in ("RGBA", "LA"): raise SystemExit(f"{p}: transparency channel missing, mode={im.mode}")
              lo, hi = im.getchannel("A").getextrema()
              if lo != 0 or hi == 0: raise SystemExit(f"{p}: expected transparent canvas with non-empty artwork")
              if len(p.name) > 70: raise SystemExit(f"{p}: filename exceeds 70 characters")
          tb = sorted(Path("delivery/SECRET_LIBRARY_KIT/05_TAGS_BOOKMARKS").glob("*.jpg"))
          if len(tb) != 10: raise SystemExit(f"Tags/bookmarks: expected 10 JPG files, found {len(tb)}")
          for p in tb:
              im=Image.open(p)
              n=int(p.stem.split("_")[2])
              expected=(2400,3600) if n <= 5 else (2400,6000)
              if im.size != expected: raise SystemExit(f"{p}: wrong size {im.size}, expected {expected}")
              if im.mode != "RGB": raise SystemExit(f"{p}: wrong mode {im.mode}")
              dpi=im.info.get("dpi")
              if not dpi or abs(dpi[0]-300)>1 or abs(dpi[1]-300)>1: raise SystemExit(f"{p}: wrong DPI {dpi}")
              if len(p.name)>70: raise SystemExit(f"{p}: filename exceeds 70 characters")
          print("B08 raster QA PASS: 40 journal JPGs + 15 digital paper JPGs + 20 transparent ephemera PNGs + 20 decorative PNGs + 10 tag/bookmark JPGs")
          PY

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: b08-asset-delivery-verification
          path: delivery/SECRET_LIBRARY_KIT
          if-no-files-found: error

      - name: Commit final binary delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delivery/SECRET_LIBRARY_KIT/01_JOURNAL_PAGES delivery/SECRET_LIBRARY_KIT/02_DIGITAL_PAPERS delivery/SECRET_LIBRARY_KIT/03_EPHEMERA delivery/SECRET_LIBRARY_KIT/04_DECORATIVE_PNG delivery/SECRET_LIBRARY_KIT/05_TAGS_BOOKMARKS
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
            exit 0
          fi
          git commit -m "chore(B08): generate journal, digital paper, ephemera, and decorative PNG delivery"
          git fetch origin main
          git rebase origin/main
          git push
