<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2400" viewBox="0 0 3600 2400"><rect x="300" y="300" width="3000" height="1800" rx="6" fill="#E9E0CA" stroke="#6F5B43" stroke-width="12"/><text x="520" y="560" font-family="Georgia,serif" font-size="52" font-weight="700" fill="#6F5B43" text-anchor="start" letter-spacing="4px">LETTER — 14 OCTOBER</text><text x="520" y="790" font-family="Georgia,serif" font-size="58" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">Dear ________,</text><text x="520" y="980" font-family="Georgia,serif" font-size="54" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">I found the volume you asked about, but</text><text x="520" y="1090" font-family="Georgia,serif" font-size="54" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">there is something unusual in the catalogue.</text><text x="520" y="1200" font-family="Georgia,serif" font-size="54" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">Its number appears twice.</text><text x="520" y="1390" font-family="Georgia,serif" font-size="54" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">I will bring it after closing.</text><text x="520" y="1580" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#3F4A3D" text-anchor="start" letter-spacing="0px">Yours, __________________</text><line x1="520" y1="1710" x2="3060" y2="1710" stroke="#B7AA91" stroke-width="5"/><text x="520" y="1900" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#6A3D3A" text-anchor="start" letter-spacing="5px">KEEP PRIVATE</text></svg>