<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2400" viewBox="0 0 3600 2400"><rect x="300" y="300" width="3000" height="1800" rx="6" fill="#E9E0CA" stroke="#6F5B43" stroke-width="10"/><text x="540" y="560" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#6A3D3A" text-anchor="start" letter-spacing="4px">FRAGMENT / MS. IV</text><text x="540" y="760" font-family="Georgia,serif" font-size="55" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">The candle had burned low before the final</text><text x="540" y="880" font-family="Georgia,serif" font-size="55" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">page revealed a name beneath the ink.</text><text x="540" y="1000" font-family="Georgia,serif" font-size="55" font-weight="400" fill="#25231F" text-anchor="start" letter-spacing="0px">In the margin, a careful hand had written:</text><text x="720" y="1190" font-family="Georgia,serif" font-size="64" font-weight="700" fill="#3F4A3D" text-anchor="start" letter-spacing="0px">“Keep this volume where the light cannot find it.”</text><text x="540" y="1430" font-family="Georgia,serif" font-size="46" font-weight="400" fill="#6F5B43" text-anchor="start" letter-spacing="0px">— folio 27, private collection</text><line x1="540" y1="1540" x2="3060" y2="1540" stroke="#B7AA91" stroke-width="5"/><text x="540" y="1740" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#6F5B43" text-anchor="start" letter-spacing="3px">ARCHIVAL TRANSCRIPTION</text></svg>